apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wisecow
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  # TLS terminates at the Ingress controller using the secret "wisecow-tls".
  # Create the secret with: ./k8s/create-tls-secret.sh
  tls:
    - hosts:
        - wisecow.local
      secretName: wisecow-tls
  rules:
    - host: wisecow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wisecow
                port:
                  number: 80
